apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-payroll-ingress
  namespace: hr-payroll
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  tls:
  - hosts:
    - api.hrpayroll.example.com
    secretName: hrpayroll-tls-cert
  rules:
  - host: api.hrpayroll.example.com
    http:
      paths:
      - path: /api/v1/employees
        pathType: Prefix
        backend:
          service:
            name: employee-service
            port:
              number: 80
      - path: /api/v1/payroll
        pathType: Prefix
        backend:
          service:
            name: payroll-service
            port:
              number: 80
      - path: /api/v1/attendance
        pathType: Prefix
        backend:
          service:
            name: time-attendance-service
            port:
              number: 80
      - path: /api/v1/leaves
        pathType: Prefix
        backend:
          service:
            name: time-attendance-service
            port:
              number: 80
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/v1/benefits
        pathType: Prefix
        backend:
          service:
            name: benefits-service
            port:
              number: 80
      - path: /api/v1/performance
        pathType: Prefix
        backend:
          service:
            name: performance-service
            port:
              number: 80
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              number: 80
